# used to create the object
name: FrankaToy

physics_engine: ${..physics_engine}

# if given, will override the device setting in gym. 
env:
  numEnvs: 4096
  envSpacing: 2.4
  episodeLength: 32
  obsForce: False
  enableDebugVis: False

  mininertia: 1.0
  maxinertia: 10.0
  minstiffness: 100.0
  maxstiffness: 1000.0
  minmass: 0.2
  maxmass: 1.2
  minfriction: 0.1
  maxfriction: 0.6

  initfrankaDofNoise: 0.0
  initboxradius: 0.2

  controlType: 'position' # 'osc' or 'admittance' or 'position'
  # Number of compliance control steps per policy step (only used for admittance control)
  nControlLoop: 30 # Note: Effective dt for the simulation becomes nControlLoop * dt
  integrationVar: "x_d" # 'error' or 'x_d'. If 'error', error = x_d - x_r is continous, else x_d is continous

  asset:
    assetRoot: "../../assets"
    assetFileNameFranka: "urdf/franka_description/robots/franka_panda_finger.urdf"

  # set to True if you use camera sensors in the environment
  enableCameraSensors: False

sim:
  dt: 0.01667 # 0.5 for 'osc', 0.5/nControlLoop for 'admittance' and 'position'
  substeps: 2
  up_axis: "z"
  use_gpu_pipeline: ${eq:${...pipeline},"gpu"}
  gravity: [0.0, 0.0, -9.81]
  physx:
    num_threads: ${....num_threads}
    solver_type: ${....solver_type}
    use_gpu: ${contains:"cuda",${....sim_device}} # set to False to run on CPU
    num_position_iterations: 8
    num_velocity_iterations: 1
    contact_offset: 0.005
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 1000.0
    default_buffer_size_multiplier: 5.0
    max_gpu_contact_pairs: 1048576 # 1024*1024
    num_subscenes: ${....num_subscenes}
    contact_collection: 0 # 0: CC_NEVER (don't collect contact info), 1: CC_LAST_SUBSTEP (collect only contacts on last substep), 2: CC_ALL_SUBSTEPS (broken - do not use!)

task:
  randomize: False